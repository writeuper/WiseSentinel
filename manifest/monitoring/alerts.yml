groups:
  - name: wisesentinel-platform
    rules:
      - alert: WiseSentinelPlatformDown
        expr: up{job="wisesentinel-platform"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: WiseSentinel platform is down
          description: Prometheus cannot scrape the WiseSentinel platform for more than 2 minutes.

      - alert: WiseSentinelHighHttpErrorRate
        expr: |
          sum(rate(ws_http_requests_total{job="wisesentinel-platform",code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(ws_http_requests_total{job="wisesentinel-platform"}[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: WiseSentinel HTTP 5xx error rate is high
          description: HTTP 5xx responses exceed 5% of requests for more than 5 minutes.

      - alert: WiseSentinelHighHttpLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(ws_http_request_duration_seconds_bucket{job="wisesentinel-platform"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: WiseSentinel HTTP p95 latency is high
          description: HTTP p95 latency is above 1 second for more than 10 minutes.

      - alert: WiseSentinelToolCallFailureRate
        expr: |
          sum(rate(ws_tool_calls_total{job="wisesentinel-platform",outcome=~"error|timeout|unavailable"}[5m]))
          /
          clamp_min(sum(rate(ws_tool_calls_total{job="wisesentinel-platform"}[5m])), 1)
          > 0.10
        for: 10m
        labels:
          severity: warning
          component: tools
        annotations:
          summary: WiseSentinel tool-call failure rate is high
          description: Tool calls with error, timeout or unavailable outcomes exceed 10% of calls for more than 10 minutes. Check Tool Gateway dependencies, timeouts and allowlists.

      - alert: WiseSentinelRAGHighRetrievalLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(ws_rag_retrieval_duration_seconds_bucket{job="wisesentinel-platform"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
          component: rag
        annotations:
          summary: WiseSentinel RAG retrieval p95 latency is high
          description: RAG retrieval p95 latency is above 1 second for more than 10 minutes. Check Milvus, embedding and retrieval dependency health.

      - alert: WiseSentinelOpsHighTaskLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(ws_ops_task_duration_seconds_bucket{job="wisesentinel-platform",stage="e2e"}[5m]))
          ) > 10
        for: 10m
        labels:
          severity: warning
          component: ops
        annotations:
          summary: WiseSentinel Ops task p95 latency is high
          description: Ops end-to-end task p95 latency is above 10 seconds for more than 10 minutes. Check queue backlog, model latency, tool retries and replanning.

      - alert: WiseSentinelRAGVectorGCDeadLetter
        expr: ws_rag_vector_gc_dead_tasks_24h > 0
        for: 5m
        labels:
          severity: warning
          component: rag
        annotations:
          summary: WiseSentinel RAG vector-GC has dead-letter tasks
          description: A vector cleanup task entered dead-letter state within the last 24 hours. Inspect the tenant-scoped Vector GC administration queue and use the approval-controlled redrive flow. Historical dead backlog is tracked separately.

      - alert: WiseSentinelRAGVectorGCHistoricalBacklog
        expr: ws_rag_vector_gc_tasks{status="dead"} > 20
        for: 30m
        labels:
          severity: info
          component: rag
        annotations:
          summary: WiseSentinel RAG vector-GC historical backlog is elevated
          description: Historical vector-GC dead-letter backlog remains above 20 tasks for 30 minutes. This is a governance/cleanup queue, not necessarily a new incident; review tenant-scoped tasks and use the approval-controlled redrive flow after checking Milvus capacity.

      - alert: WiseSentinelRAGVectorGCRetryBacklog
        expr: ws_rag_vector_gc_tasks{status="retry_wait"} > 20
        for: 15m
        labels:
          severity: warning
          component: rag
        annotations:
          summary: WiseSentinel RAG vector-GC retry backlog is elevated
          description: More than 20 cleanup tasks are waiting for retry for 15 minutes. Check Milvus availability and cleanup worker health.

      - alert: WiseSentinelAlertEventOrphanReservations
        expr: increase(ws_alert_event_orphan_reaped_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          component: webhook
        annotations:
          summary: WiseSentinel reclaimed orphan Alertmanager reservations
          description: One or more signed Webhook reservations survived without an Ops task and were reclaimed. Inspect process restarts, database errors, and task-creation latency.
